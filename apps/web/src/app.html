<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/quikmarq-mark.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				var match = document.cookie.match(/(?:^|; )quikmarq_theme=(system|light|dark)(?:;|$)/);
				var saved = match ? match[1] : localStorage.getItem("quikmarq_theme");
				var preference = saved === "dark" || saved === "light" ? saved : "system";
				document.documentElement.dataset.theme =
					preference === "system"
						? matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light"
						: preference;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
